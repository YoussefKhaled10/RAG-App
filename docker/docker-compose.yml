services:

  fastapi:
    build:
      context: ..
      dockerfile: docker/rag/Dockerfile

    container_name: fastapi

    ports:
      - "8000:8000"

    volumes:
      - ../src/assets/files:/app/assets/files

    env_file:
      - ./env/.env.app

    environment:
      POSTGRES_HOST: "pgvector"
      POSTGRES_PORT: "5432"
      POSTGRES_URL: >-
        postgresql+asyncpg://${POSTGRES_USERNAME}:${POSTGRES_PASSWORD}@pgvector:5432/${POSTGRES_DATABASE}
      POSTGRES_SYNC_URL: >-
        postgresql://${POSTGRES_USERNAME}:${POSTGRES_PASSWORD}@pgvector:5432/${POSTGRES_DATABASE}

      CELERY_BROKER_URL: >-
        amqp://${RABBITMQ_USERNAME}:${RABBITMQ_PASSWORD}@rabbitmq:5672/${RABBITMQ_VHOST}
      CELERY_RESULT_BACKEND: >-
        redis://:${REDIS_PASSWORD}@redis:6379/0

    depends_on:
      pgvector:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - backend

    restart: always
  nginx:
    image: nginx:stable-alpine3.20-perl

    container_name: nginx

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - fastapi

    networks:
      - backend

    restart: always

  pgvector:
    image: pgvector/pgvector:0.8.0-pg17

    container_name: pgvector

    ports:
      - "5433:5432"

    volumes:
      - pgvector:/var/lib/postgresql/data

    environment:
      POSTGRES_USER: "${POSTGRES_USERNAME}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DATABASE}"

    networks:
      - backend

    restart: always

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USERNAME} -d ${POSTGRES_DATABASE}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.13.6

    container_name: qdrant

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_data:/qdrant/storage

    networks:
      - backend

    restart: always

    profiles:
      - qdrant

  rabbitmq:
    image: rabbitmq:4.1.2-management-alpine

    container_name: rabbitmq

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro

    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USERNAME}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD}"
      RABBITMQ_DEFAULT_VHOST: "${RABBITMQ_VHOST}"

    networks:
      - backend

    restart: always

    healthcheck:
      test:
        [
          "CMD",
          "rabbitmq-diagnostics",
          "-q",
          "ping"
        ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s

  redis:
    image: redis:8.0.3-alpine

    container_name: redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - "${REDIS_PASSWORD}"

    networks:
      - backend

    restart: always

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a '${REDIS_PASSWORD}' ping | grep PONG"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  celery_worker:
    build:
      context: ..
      dockerfile: docker/rag/Dockerfile

    container_name: celery_worker

    command:
      - celery
      - -A
      - celery_app.celery_app
      - worker
      - --loglevel=info
      - -E
      - -Q
      - file_processing,default
      - --concurrency=1
      - --prefetch-multiplier=1

    volumes:
      - ../src/assets/files:/app/assets/files

    env_file:
      - ./env/.env.app

    environment:
      CELERY_BROKER_URL: >-
        amqp://${RABBITMQ_USERNAME}:${RABBITMQ_PASSWORD}@rabbitmq:5672/${RABBITMQ_VHOST}
      CELERY_RESULT_BACKEND: >-
        redis://:${REDIS_PASSWORD}@redis:6379/0

      POSTGRES_HOST: "pgvector"
      POSTGRES_PORT: "5432"
      POSTGRES_URL: >-
        postgresql+asyncpg://${POSTGRES_USERNAME}:${POSTGRES_PASSWORD}@pgvector:5432/${POSTGRES_DATABASE}
      POSTGRES_SYNC_URL: >-
        postgresql://${POSTGRES_USERNAME}:${POSTGRES_PASSWORD}@pgvector:5432/${POSTGRES_DATABASE}

    depends_on:
      pgvector:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - backend

    restart: always

  flower:
    build:
      context: ..
      dockerfile: docker/rag/Dockerfile

    container_name: flower

    command:
      - celery
      - -A
      - celery_app.celery_app
      - flower
      - --port=5555
      - --basic-auth=${FLOWER_USERNAME}:${FLOWER_PASSWORD}

    ports:
      - "5555:5555"

    env_file:
      - ./env/.env.app

    environment:
      CELERY_BROKER_URL: >-
        amqp://${RABBITMQ_USERNAME}:${RABBITMQ_PASSWORD}@rabbitmq:5672/${RABBITMQ_VHOST}
      CELERY_RESULT_BACKEND: >-
        redis://:${REDIS_PASSWORD}@redis:6379/0

    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_started

    networks:
      - backend

    restart: always

  prometheus:
    image: prom/prometheus:v3.3.0

    container_name: prometheus

    ports:
      - "9090:9090"

    volumes:
      - prometheus_data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/etc/prometheus/console_libraries
      - --web.console.templates=/etc/prometheus/consoles
      - --web.enable-lifecycle

    networks:
      - backend

    restart: always

  grafana:
    image: grafana/grafana:11.6.0-ubuntu

    container_name: grafana

    ports:
      - "3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana

    env_file:
      - ./env/.env.grafana

    depends_on:
      - prometheus

    networks:
      - backend

    restart: always

  node-exporter:
    image: prom/node-exporter:v1.9.1

    container_name: node-exporter

    ports:
      - "9100:9100"

    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

    command:
      - --path.procfs=/host/proc
      - --path.rootfs=/rootfs
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)

    networks:
      - backend

    restart: always

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1

    container_name: postgres-exporter

    ports:
      - "9187:9187"

    environment:
      DATA_SOURCE_URI: >-
        pgvector:5432/${POSTGRES_DATABASE}?sslmode=disable
      DATA_SOURCE_USER: "${POSTGRES_USERNAME}"
      DATA_SOURCE_PASS: "${POSTGRES_PASSWORD}"

    depends_on:
      pgvector:
        condition: service_healthy

    networks:
      - backend

    restart: always


networks:
  backend:
    driver: bridge


volumes:
  pgvector:
  qdrant_data:
  prometheus_data:
  grafana_data:
  redis_data:
  rabbitmq_data: